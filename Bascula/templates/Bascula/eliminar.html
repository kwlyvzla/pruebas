{% extends 'base.html' %}
{% block titulo %}Eliminar Registro{% endblock %}
{% block contenido %}
<style>
    .card { background: white; padding: 30px; border-radius: 12px; max-width: 500px; margin: auto; text-align: center; box-shadow: 0 2px 8px rgba(0,50,120,0.1); }
    h1 { color: #dc3545; margin-bottom: 15px; }
    .info { background: #f1f5f9; padding: 15px; border-radius: 8px; margin: 20px 0; }
    .btn-del { background: #dc3545; color: white; padding: 12px 30px; border: none; border-radius: 8px; cursor: pointer; }
    .btn-cancel { background: #64748b; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; margin-left: 10px; }
</style>
<div class="card">
    <h1>⚠️ Eliminar Registro</h1>
    <p>¿Eliminar este registro de peso?</p>
    <div class="info"><strong>{{ registro.peso }} kg</strong><br>{{ registro.fecha_registro|date:"d/m/Y H:i:s" }}</div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-del">Sí, eliminar</button>
        <a href="{% url 'bascula' %}" class="btn-cancel">Cancelar</a>
    </form>
</div>
{% endblock %}
