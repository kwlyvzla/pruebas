{% extends 'base.html' %}

{% block titulo %}Limpiar Registros - Báscula{% endblock %}

{% block contenido %}
<style>
    .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 500px;
        margin: auto;
        text-align: center;
    }
    .icono { font-size: 60px; margin-bottom: 20px; }
    h1 { color: #dc3545; margin-bottom: 15px; }
    .btn-eliminar-todo {
        background: #dc3545;
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
    .btn-eliminar-todo:hover { background: #c82333; }
    .btn-cancelar {
        background: #6c757d;
        color: white;
        padding: 12px 30px;
        text-decoration: none;
        border-radius: 5px;
        margin-left: 10px;
    }
    .buttons { margin-top: 20px; }
    .advertencia { color: #dc3545; margin: 15px 0; font-weight: bold; }
</style>

<div class="card">
    <div class="icono">⚠️</div>
    <h1>Limpiar Todos los Registros</h1>
    <p>¿Estás seguro de que deseas eliminar <strong>TODOS</strong> los registros de peso?</p>
    <p class="advertencia">⚠️ Esta acción no se puede deshacer</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="buttons">
            <button type="submit" class="btn-eliminar-todo">Sí, eliminar todo</button>
            <a href="{% url 'bascula' %}" class="btn-cancelar">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
