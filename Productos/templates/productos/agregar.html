<!DOCTYPE html>
<html>
<head>
    <title>Agregar Producto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #555; 
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        textarea { resize: vertical; min-height: 80px; }
        .btn-guardar {
            background: #28a745;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-guardar:hover { background: #218838; }
        .btn-cancelar {
            background: #6c757d;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 5px;
            margin-left: 10px;
        }
        .btn-cancelar:hover { background: #5a6268; }
        .buttons { margin-top: 20px; }
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .form-check input {
            width: auto;
        }
        .menu {
            margin-bottom: 20px;
        }
        .menu a {
            color: #007bff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 5px;
            background: white;
        }
        .menu a:hover { background: #e9ecef; }
    </style>
</head>
<body>
    <div class="container">
        <div class="menu">
            <a href="/">🏠 Proveedores</a>
            <a href="/productos/">📦 Productos</a>
        </div>
        
        <div class="card">
            <h1>➕ Agregar Producto</h1>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="nombre">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Laptop HP">
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" placeholder="Descripción del producto"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="precio">Precio *</label>
                    <input type="number" id="precio" name="precio" required step="0.01" placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" name="stock" value="0" placeholder="0">
                </div>
                
                <div class="form-group">
                    <label for="proveedor">Proveedor</label>
                    <select id="proveedor" name="proveedor">
                        <option value="">Seleccionar proveedor...</option>
                        {% for proveedor in proveedores %}
                        <option value="{{ proveedor.id }}">{{ proveedor.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="activo" name="activo" checked>
                        <label for="activo" style="margin: 0;">Producto activo</label>
                    </div>
                </div>
                
                <div class="buttons">
                    <button type="submit" class="btn-guardar">Guardar</button>
                    <a href="{% url 'lista_productos' %}" class="btn-cancelar">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
