{% extends 'base.html' %}

{% block titulo %}Editar Empleado - Sistema de Gestión{% endblock %}

{% block contenido %}
<style>
    .form-container {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        max-width: 700px;
        margin: 0 auto;
    }
    h1 { color: #333; margin-bottom: 20px; border-bottom: 2px solid #ffc107; padding-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    label .required { color: #dc3545; }
    input, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        font-size: 16px;
    }
    textarea { resize: vertical; min-height: 80px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .form-check { display: flex; align-items: center; gap: 10px; }
    .form-check input { width: auto; }
    .help-text { font-size: 12px; color: #999; margin-top: 5px; }
    .btn-actualizar {
        background: #ffc107;
        color: #333;
        padding: 12px 40px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
    .btn-actualizar:hover { background: #e0a800; }
    .btn-cancelar {
        background: #6c757d;
        color: white;
        padding: 12px 40px;
        text-decoration: none;
        border-radius: 5px;
        margin-left: 10px;
        display: inline-block;
    }
    .btn-cancelar:hover { background: #5a6268; }
    .buttons { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
    .section-title { 
        color: #495057; 
        margin: 25px 0 15px 0; 
        padding-bottom: 8px; 
        border-bottom: 1px solid #dee2e6;
    }
    .badge-opcional { 
        background: #6c757d; 
        color: white; 
        padding: 2px 8px; 
        border-radius: 12px; 
        font-size: 11px;
        font-weight: normal;
        margin-left: 8px;
    }
    .numero-box {
        background: #007bff;
        color: white;
        padding: 15px 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        text-align: center;
    }
    .numero-box .numero {
        font-size: 32px;
        font-weight: bold;
        font-family: 'Courier New', monospace;
    }
    .numero-box .label {
        font-size: 14px;
        opacity: 0.9;
    }
    @media (max-width: 768px) {
        .form-row { grid-template-columns: 1fr; }
    }
</style>

<div class="form-container">
    <h1>✏️ Editar Empleado</h1>
    
    <div class="numero-box">
        <div class="label">Número de empleado</div>
        <div class="numero">{{ empleado.numero_empleado }}</div>
    </div>
    
    <form method="post">
        {% csrf_token %}
        
        <!-- 👤 Datos Personales -->
        <h3 class="section-title">👤 Datos Personales</h3>
        
        <div class="form-group">
            <label for="nombre">Nombre completo <span class="required">*</span></label>
            <input type="text" id="nombre" name="nombre" value="{{ empleado.nombre }}" required>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="email">Correo electrónico <span class="badge-opcional">Opcional</span></label>
                <input type="email" id="email" name="email" value="{{ empleado.email }}">
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono <span class="badge-opcional">Opcional</span></label>
                <input type="tel" id="telefono" name="telefono" value="{{ empleado.telefono }}">
            </div>
        </div>
        
        <div class="form-group">
            <label for="direccion">Dirección <span class="badge-opcional">Opcional</span></label>
            <textarea id="direccion" name="direccion">{{ empleado.direccion }}</textarea>
        </div>
        
        <!-- 💼 Datos Laborales -->
        <h3 class="section-title">💼 Datos Laborales</h3>
        
        <div class="form-row">
            <div class="form-group">
                <label for="puesto">Puesto <span class="badge-opcional">Opcional</span></label>
                <input type="text" id="puesto" name="puesto" value="{{ empleado.puesto }}">
            </div>
            <div class="form-group">
                <label for="departamento">Departamento <span class="badge-opcional">Opcional</span></label>
                <input type="text" id="departamento" name="departamento" value="{{ empleado.departamento }}">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="fecha_ingreso">Fecha de ingreso <span class="badge-opcional">Opcional</span></label>
                <input type="date" id="fecha_ingreso" name="fecha_ingreso" value="{{ empleado.fecha_ingreso|date:'Y-m-d' }}">
            </div>
            <div class="form-group">
                <label for="salario">Salario <span class="badge-opcional">Opcional</span></label>
                <input type="number" id="salario" name="salario" step="0.01" min="0" value="{{ empleado.salario }}">
            </div>
        </div>
        
        <!-- 📅 Estado -->
        <h3 class="section-title">📅 Estado</h3>
        
        <div class="form-group">
            <div class="form-check">
                <input type="checkbox" id="activo" name="activo" {% if empleado.activo %}checked{% endif %}>
                <label for="activo" style="margin: 0;">Empleado activo</label>
            </div>
        </div>
        
        <div class="buttons">
            <button type="submit" class="btn-actualizar">💾 Actualizar Empleado</button>
            <a href="{% url 'lista_empleados' %}" class="btn-cancelar">❌ Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
