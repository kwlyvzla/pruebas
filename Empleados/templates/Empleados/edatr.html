{% extends 'base.html' %}
{% block titulo %}Editar Empleado{% endblock %}
{% block contenido %}
<style>
    .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,50,120,0.1); }
    h1 { color: #0f2b5c; margin-bottom: 20px; border-bottom: 2px solid #f59e0b; padding-bottom: 10px; }
    .aviso { background: #dbeafe; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; color: #1e40af; border-left: 4px solid #2563eb; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .foto-actual { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #2563eb; margin-bottom: 10px; }
    .btn-save { background: #f59e0b; color: #333; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-cancel { background: #64748b; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; margin-left: 10px; display: inline-block; }
</style>
<div class="form-container">
    <h1>✏️ Editar Empleado</h1>
    <div class="aviso">🔢 Número de empleado: <strong>{{ empleado.numero_empleado }}</strong> (no modificable)</div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% if empleado.foto %}
            <img src="{{ empleado.foto.url }}" class="foto-actual">
        {% endif %}
        <div class="form-group"><label>Cambiar foto</label><input type="file" name="foto" accept="image/*"></div>
        <div class="form-group"><label>Nombre completo *</label><input type="text" name="nombre_completo" value="{{ empleado.nombre_completo }}" required></div>
        <div class="row">
            <div class="form-group"><label>Teléfono *</label><input type="tel" name="telefono" value="{{ empleado.telefono }}" required></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ empleado.email }}" required></div>
        </div>
        <div class="form-group"><label>Dirección *</label><textarea name="direccion" required>{{ empleado.direccion }}</textarea></div>
        <div class="row">
            <div class="form-group">
                <label>Puesto</label>
                <select name="puesto">
                    <option value="GERENTE" {% if empleado.puesto == 'GERENTE' %}selected{% endif %}>Gerente</option>
                    <option value="SUPERVISOR" {% if empleado.puesto == 'SUPERVISOR' %}selected{% endif %}>Supervisor</option>
                    <option value="ADMINISTRATIVO" {% if empleado.puesto == 'ADMINISTRATIVO' %}selected{% endif %}>Administrativo</option>
                    <option value="OPERATIVO" {% if empleado.puesto == 'OPERATIVO' %}selected{% endif %}>Operativo</option>
                    <option value="VENTAS" {% if empleado.puesto == 'VENTAS' %}selected{% endif %}>Ventas</option>
                    <option value="ALMACEN" {% if empleado.puesto == 'ALMACEN' %}selected{% endif %}>Almacén</option>
                    <option value="OTRO" {% if empleado.puesto == 'OTRO' %}selected{% endif %}>Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Departamento</label>
                <select name="departamento">
                    <option value="ADMINISTRACION" {% if empleado.departamento == 'ADMINISTRACION' %}selected{% endif %}>Administración</option>
                    <option value="VENTAS" {% if empleado.departamento == 'VENTAS' %}selected{% endif %}>Ventas</option>
                    <option value="PRODUCCION" {% if empleado.departamento == 'PRODUCCION' %}selected{% endif %}>Producción</option>
                    <option value="ALMACEN" {% if empleado.departamento == 'ALMACEN' %}selected{% endif %}>Almacén</option>
                    <option value="RECURSOS_HUMANOS" {% if empleado.departamento == 'RECURSOS_HUMANOS' %}selected{% endif %}>Recursos Humanos</option>
                    <option value="CONTABILIDAD" {% if empleado.departamento == 'CONTABILIDAD' %}selected{% endif %}>Contabilidad</option>
                    <option value="SISTEMAS" {% if empleado.departamento == 'SISTEMAS' %}selected{% endif %}>Sistemas</option>
                    <option value="OTRO" {% if empleado.departamento == 'OTRO' %}selected{% endif %}>Otro</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group"><label>Fecha de ingreso</label><input type="date" name="fecha_ingreso" value="{{ empleado.fecha_ingreso|date:'Y-m-d' }}"></div>
            <div class="form-group"><label>Salario</label><input type="number" name="salario" step="0.01" value="{{ empleado.salario|default:'' }}"></div>
        </div>
        <div class="form-group"><label><input type="checkbox" name="activo" {% if empleado.activo %}checked{% endif %}> Activo</label></div>
        <button type="submit" class="btn-save">💾 Actualizar</button>
        <a href="{% url 'lista_empleados' %}" class="btn-cancel">Cancelar</a>
    </form>
</div>
{% endblock %}
