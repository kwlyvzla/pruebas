{% extends 'base.html' %}
{% block titulo %}Agregar Empleado{% endblock %}
{% block contenido %}
<style>
    .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 800px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,50,120,0.1); }
    h1 { color: #0f2b5c; margin-bottom: 20px; border-bottom: 2px solid #2563eb; padding-bottom: 10px; }
    .aviso { background: #dbeafe; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; color: #1e40af; border-left: 4px solid #2563eb; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .btn-save { background: #2563eb; color: white; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-cancel { background: #64748b; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; margin-left: 10px; display: inline-block; }
</style>
<div class="form-container">
    <h1>➕ Agregar Empleado</h1>
    <div class="aviso">🔢 El número de empleado será generado automáticamente</div>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group"><label>Foto</label><input type="file" name="foto" accept="image/*"></div>
        <div class="form-group"><label>Nombre completo *</label><input type="text" name="nombre_completo" required></div>
        <div class="row">
            <div class="form-group"><label>Teléfono *</label><input type="tel" name="telefono" required></div>
            <div class="form-group"><label>Email *</label><input type="email" name="email" required></div>
        </div>
        <div class="form-group"><label>Dirección *</label><textarea name="direccion" required></textarea></div>
        <div class="row">
            <div class="form-group">
                <label>Puesto</label>
                <select name="puesto">
                    <option value="GERENTE">Gerente</option>
                    <option value="SUPERVISOR">Supervisor</option>
                    <option value="ADMINISTRATIVO">Administrativo</option>
                    <option value="OPERATIVO" selected>Operativo</option>
                    <option value="VENTAS">Ventas</option>
                    <option value="ALMACEN">Almacén</option>
                    <option value="OTRO">Otro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Departamento</label>
                <select name="departamento">
                    <option value="ADMINISTRACION">Administración</option>
                    <option value="VENTAS">Ventas</option>
                    <option value="PRODUCCION">Producción</option>
                    <option value="ALMACEN">Almacén</option>
                    <option value="RECURSOS_HUMANOS">Recursos Humanos</option>
                    <option value="CONTABILIDAD">Contabilidad</option>
                    <option value="SISTEMAS">Sistemas</option>
                    <option value="OTRO" selected>Otro</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group"><label>Fecha de ingreso</label><input type="date" name="fecha_ingreso"></div>
            <div class="form-group"><label>Salario</label><input type="number" name="salario" step="0.01"></div>
        </div>
        <div class="form-group"><label><input type="checkbox" name="activo" checked> Activo</label></div>
        <button type="submit" class="btn-save">💾 Guardar</button>
        <a href="{% url 'lista_empleados' %}" class="btn-cancel">Cancelar</a>
    </form>
</div>
{% endblock %}
