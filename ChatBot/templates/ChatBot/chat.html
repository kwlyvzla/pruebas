{% extends 'base.html' %}

{% block titulo %}Chat-Bot de Asistencia{% endblock %}

{% block contenido %}
<style>
    .chat-container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,50,120,0.15); overflow: hidden; border: 1px solid #d0e0f0; }
    .chat-header { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: white; padding: 18px 20px; font-size: 18px; font-weight: 600; }
    .chat-box { height: 420px; overflow-y: auto; padding: 20px; background: #f0f6ff; display: flex; flex-direction: column; gap: 12px; }
    .message { padding: 12px 16px; border-radius: 14px; max-width: 80%; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .bot { background: #e0edff; color: #1e3a8a; align-self: flex-start; border-bottom-left-radius: 4px; }
    .user { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
    .input-area { display: flex; padding: 12px; border-top: 1px solid #d0e0f0; background: #ffffff; gap: 8px; }
    .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #b0c8e8; border-radius: 10px; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #2563eb; }
    .input-area button { padding: 12px 24px; background: #2563eb; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .input-area button:disabled { background: #94a3b8; cursor: not-allowed; }
    .empleado-selector { padding: 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; }
    .empleado-selector label { display: block; margin-bottom: 8px; font-weight: 600; color: #1e4a9e; font-size: 14px; }
    .empleado-selector select { width: 100%; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; background: white; }
    .empleado-selector button { margin-top: 10px; background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .empleado-selector button:hover { background: #1e4a9e; }
    .empleado-activo { background: #10b981; color: white; padding: 10px 16px; border-radius: 6px; font-weight: 600; display: inline-block; margin-bottom: 10px; }
    .btn-cambiar { background: #64748b; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 10px; }
    .btn-cambiar:hover { background: #475569; }
</style>

<div class="chat-container">
    <div class="chat-header">💬 Chat-Bot de Asistencia</div>

    <!-- Selector de empleado -->
    <div class="empleado-selector">
        <label for="empleado-select">Selecciona tu empleado:</label>
        <select id="empleado-select">
            <option value="">-- Selecciona un empleado --</option>
            {% for emp in empleados %}
            <option value="{{ emp.id }}">{{ emp.numero_empleado }} - {{ emp.nombre_completo }}</option>
            {% endfor %}
        </select>
        <button id="btn-seleccionar" onclick="seleccionarEmpleado()">Confirmar empleado</button>
        <button id="btn-cambiar" onclick="cambiarEmpleado()" style="display:none;">Cambiar empleado</button>
    </div>

    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Escribe 1 o 2..." onkeypress="if(event.key==='Enter') enviarMensaje()" disabled>
        <button id="btn-enviar" onclick="enviarMensaje()" disabled>Enviar</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const btnSeleccionar = document.getElementById('btn-seleccionar');
    const btnCambiar = document.getElementById('btn-cambiar');
    const btnEnviar = document.getElementById('btn-enviar');
    const empleadoSelect = document.getElementById('empleado-select');
    let empleadoSeleccionado = null;
    let ubicacion = "Obteniendo ubicación...";

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (pos) => { ubicacion = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude}`; },
            () => { ubicacion = "Ubicación no disponible"; }
        );
    } else {
        ubicacion = "Geolocalización no soportada";
    }

    function agregarMensaje(texto, clase) {
        const div = document.createElement('div');
        div.className = `message ${clase}`;
        div.textContent = texto;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function seleccionarEmpleado() {
        const empleadoId = empleadoSelect.value;
        if (!empleadoId) {
            agregarMensaje("⚠️ Por favor, selecciona un empleado de la lista.", "bot");
            return;
        }
        const nombreEmpleado = empleadoSelect.options[empleadoSelect.selectedIndex].text;
        try {
            const response = await fetch('/chatbot/api/seleccionar-empleado/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ empleado_id: empleadoId })
            });
            const data = await response.json();
            if (data.status === 'ok') {
                empleadoSeleccionado = { id: empleadoId, nombre: nombreEmpleado };
                usuarioInputDisabled(true);
                btnSeleccionar.disabled = true;
                btnCambiar.style.display = 'inline-block';
                empleadoSelect.disabled = true;
                agregarMensaje(`✅ Empleado seleccionado: ${nombreEmpleado}\nEscribe 1 para Entrada o 2 para Salida.`, "bot");
            } else {
                agregarMensaje("❌ Error al seleccionar empleado.", "bot");
            }
        } catch (error) {
            agregarMensaje("❌ Error de conexión al seleccionar empleado.", "bot");
        }
    }

    async function cambiarEmpleado() {
        try {
            const response = await fetch('/chatbot/api/limpiar-sesion/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            });
            const data = await response.json();
            if (data.status === 'ok') {
                empleadoSeleccionado = null;
                usuarioInputDisabled(false);
                btnSeleccionar.disabled = false;
                btnCambiar.style.display = 'none';
                empleadoSelect.disabled = false;
                empleadoSelect.value = '';
                agregarMensaje("🔄 Sesión limpiada. Selecciona otro empleado si deseas cambiar.", "bot");
            } else {
                agregarMensaje("❌ Error al limpiar la sesión.", "bot");
            }
        } catch (error) {
            agregarMensaje("❌ Error de conexión al cambiar empleado.", "bot");
        }
    }

    function usuarioInputDisabled(habilitar) {
        userInput.disabled = !habilitar;
        btnEnviar.disabled = !habilitar;
        if (habilitar) {
            userInput.focus();
        }
    }

    window.onload = () => {
        usuarioInputDisabled(false);
        agregarMensaje("👋 ¡Bienvenido! Primero selecciona tu empleado de la lista de arriba y presiona Confirmar.", "bot");
    };

    async function enviarMensaje() {
        const mensaje = userInput.value.trim();
        if (!mensaje) return;
        agregarMensaje(mensaje, "user");
        userInput.value = '';
        try {
            const response = await fetch('/chatbot/api/mensaje/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    mensaje: mensaje,
                    remitente: empleadoSeleccionado ? empleadoSeleccionado.nombre : "Empleado",
                    ubicacion: ubicacion
                })
            });
            const data = await response.json();
            agregarMensaje(data.respuesta, "bot");
        } catch (error) {
            agregarMensaje("❌ Error de conexión.", "bot");
        }
    }
</script>
{% endblock %}
