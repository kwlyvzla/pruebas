{% extends 'base.html' %}

{% block titulo %}Editar Asistencia{% endblock %}

{% block contenido %}
<style>
    .form-container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,50,120,0.1); }
    h1 { color: #0f2b5c; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #1e4a9e; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: #2563eb; }
    .btn-submit { background: #2563eb; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; width: auto; }
    .btn-submit:hover { background: #1e4a9e; }
    .btn-back { background: #64748b; color: white; padding: 10px 20px; border: none; border-radius: 6px; text-decoration: none; display: inline-block; margin-bottom: 20px; }
    .btn-back:hover { background: #475569; }
</style>

<a href="{% url 'chat_asistencias' %}" class="btn-back">← Volver a la lista</a>

<div class="form-container">
    <h1>✏️ Editar Registro de Asistencia</h1>
    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label for="empleado">Empleado <span style="color: #dc3545;">*</span></label>
            <select name="empleado" id="empleado" required>
                {% for emp in empleados %}
                <option value="{{ emp.id }}" {% if emp.id == asistencia.empleado.id %}selected{% endif %}>
                    {{ emp.numero_empleado }} - {{ emp.nombre_completo }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha <span style="color: #dc3545;">*</span></label>
            <input type="date" name="fecha" id="fecha" value="{{ asistencia.fecha|date:'Y-m-d' }}" required>
        </div>

        <div class="form-group">
            <label for="hora_entrada">Hora de entrada</label>
            <input type="time" name="hora_entrada" id="hora_entrada" value="{{ asistencia.hora_entrada|time:'H:i' }}">
        </div>

        <div class="form-group">
            <label for="hora_salida">Hora de salida</label>
            <input type="time" name="hora_salida" id="hora_salida" value="{{ asistencia.hora_salida|time:'H:i' }}">
        </div>

        <div class="form-group">
            <label for="estado">Estado <span style="color: #dc3545;">*</span></label>
            <select name="estado" id="estado" required>
                <option value="PRESENTE" {% if asistencia.estado == 'PRESENTE' %}selected{% endif %}>Presente</option>
                <option value="AUSENTE" {% if asistencia.estado == 'AUSENTE' %}selected{% endif %}>Ausente</option>
                <option value="RETARDO" {% if asistencia.estado == 'RETARDO' %}selected{% endif %}>Retardo</option>
                <option value="PERMISO" {% if asistencia.estado == 'PERMISO' %}selected{% endif %}>Permiso</option>
            </select>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones</label>
            <textarea name="observaciones" id="observaciones" rows="3">{{ asistencia.observaciones }}</textarea>
        </div>

        <button type="submit" class="btn-submit">💾 Guardar Cambios</button>
    </form>
</div>
{% endblock %}
