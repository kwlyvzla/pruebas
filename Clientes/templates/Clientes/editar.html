{% extends 'base.html' %}
{% block titulo %}Editar Cliente{% endblock %}
{% block contenido %}
<style>
    .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 600px; margin: 0 auto; box-shadow: 0 2px 8px rgba(0,50,120,0.1); }
    h1 { color: #0f2b5c; margin-bottom: 20px; border-bottom: 2px solid #f59e0b; padding-bottom: 10px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #334155; }
    input, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .btn-save { background: #f59e0b; color: #333; padding: 12px 30px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .btn-cancel { background: #64748b; color: white; padding: 12px 30px; border-radius: 8px; text-decoration: none; margin-left: 10px; display: inline-block; }
</style>
<div class="form-container">
    <h1>✏️ Editar Cliente</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>Nombre *</label><input type="text" name="nombre" value="{{ cliente.nombre }}" required></div>
        <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ cliente.email }}" required></div>
        <div class="form-group"><label>Teléfono *</label><input type="tel" name="telefono" value="{{ cliente.telefono }}" required></div>
        <div class="form-group"><label>Dirección *</label><textarea name="direccion" required>{{ cliente.direccion }}</textarea></div>
        <div class="form-group"><label>RFC</label><input type="text" name="rfc" value="{{ cliente.rfc }}"></div>
        <div class="form-group"><label>Empresa</label><input type="text" name="empresa" value="{{ cliente.empresa }}"></div>
        <div class="form-group"><label><input type="checkbox" name="activo" {% if cliente.activo %}checked{% endif %}> Activo</label></div>
        <button type="submit" class="btn-save">💾 Actualizar</button>
        <a href="{% url 'lista_clientes' %}" class="btn-cancel">Cancelar</a>
    </form>
</div>
{% endblock %}
